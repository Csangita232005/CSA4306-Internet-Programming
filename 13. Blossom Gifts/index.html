<!DOCTYPE html>
<html>
<head>
    <title>BlossomGifts</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>BlossomGifts</h1>
    <p>Flowers & Gifts for Every Occasion</p>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#products">Products</a>
    <a href="#cart">Cart</a>
</nav>

<section>
    <h2>Categories</h2>
    <button>Flowers</button>
    <button>Gift Baskets</button>
    <button>Personalized Gifts</button>
</section>

<section id="products">
    <h2>Our Products</h2>

    <div class="product">
        <h3>Rose Bouquet</h3>
        <p>₹500</p>
        <button onclick="addCart('Rose Bouquet')">
            Add to Cart
        </button>
    </div>

    <div class="product">
        <h3>Gift Basket</h3>
        <p>₹800</p>
        <button onclick="addCart('Gift Basket')">
            Add to Cart
        </button>
    </div>

    <div class="product">
        <h3>Birthday Gift</h3>
        <p>₹600</p>
        <button onclick="addCart('Birthday Gift')">
            Add to Cart
        </button>
    </div>
</section>

<section id="cart">
    <h2>Shopping Cart</h2>
    <p id="cartItem">Cart is empty</p>

    <button onclick="checkout()">Checkout</button>
</section>

<script src="script.js"></script>

</body>
</html>
