<!DOCTYPE html>
<html>
    <head>
        <title>Fashion E-Commerce Website</title>
    </head>
    <body bgcolor="lavender">
        <h1 align="center">Fashion E-Commerce Website</h1>
        <form>
            Customer Name :
            <input type="text"><br><br>
            Product :
            <select>
                <option>T-Shirt</option>
                <option>Jeans</option>
                <option>Saree</option>
                <option>Kurti</option>
                <option>Shoes</option>
            </select>
            <br><br>
            Size :
            <select>
                <option>S</option>
                <option>M</option>
                <option>L</option>
                <option>XL</option>
            </select>
            <br><br>
            Quantity :
            <input type="number"><br><br>
            Delivery Address :
            <textarea rows="4" cols="30"></textarea>
            <br><br>
            <input type="submit" value="Buy Now">
            <input type="reset" value="Clear">
        </form>
    </body>
    </html>
